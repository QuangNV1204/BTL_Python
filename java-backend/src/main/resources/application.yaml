server:
  port: 8080
spring:
  application:
    name: learningai
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: ${DBMS_CONNECTION}
    username: ${DBMS_USERNAME}
    password: ${DBMS_PASSWORD}
  jackson:
    property-naming-strategy: SNAKE_CASE
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
        one-indexed-parameters: true
        size-parameter: page_size
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
jwt:
  jwt-signing-key: ${JWT_SIGNING_KEY}
  access-ttl: 900000
  refresh-ttl: 604800000

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  auth:
    cookie:
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: Lax
  storage:
    location: ${APP_STORAGE_LOCATION:./uploads}
    public-base-url: ${APP_STORAGE_PUBLIC_BASE_URL:/api/v1/files}
    lesson-documents: ${LESSON_DOCUMENT_STORAGE:./data/lesson-documents}
  ai:
    provider: ${AI_PROVIDER:mock}
    base-url: ${AI_BASE_URL:https://openrouter.ai/api/v1}
    model: ${AI_MODEL:}
    api-key: ${AI_API_KEY:}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:90}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:8192}
    max-source-chars: 20000
